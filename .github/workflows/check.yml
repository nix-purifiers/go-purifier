# SPDX-License-Identifier: MIT
#
# Checks every pull request and every push to main, on x86_64-linux,
# aarch64-linux and aarch64-darwin.
#
# `flake-check` builds the flake's checks: the conformance checks the Nix
# sandbox can run (stale, tampered, missing, malformed and external), every
# fixture offline from its lockfile, readLock, the release archives, the
# go-purifier command with its unit tests, and the formatting.
#
# The conformance checks that need the network or the Nix daemon run as
# jobs of the same names:
#
# - `conformance-relock` locks this repository, every fixture and fzf
#   again, writes the conformance fixtures again, and fails unless every
#   file comes out byte for byte as committed.
# - `conformance-rebuild` builds the hello fixture a second time with
#   `nix build --rebuild`, which fails unless the output is the same.
# - `conformance-offline` runs `go-purifier prefetch` on each fixture, then
#   the go command and gopls with no route to the network
#   (tests/interactive.sh).
# - `conformance-update` runs `go-purifier update` on a copy of the hello
#   fixture, and checks that go.mod moved and the lockfile passes the stale
#   check (tests/update.sh).
#
# `outside-the-sandbox` runs the other checks that need Nix, servers or the
# network: the errors of common lockfile mistakes (tests/negative.sh),
# `go-purifier publish --dry-run` (tests/release.sh), and modules from
# Mercurial, Subversion, Bazaar and Fossil repositories served on the
# runner (tests/vcs-systems.sh).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the checks
        run: nix flake check --print-build-logs

  composition:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the toolchain
        run: nix build .#toolchain --out-link toolchain
      - name: Compose independent Go projects
        run: python3 tests/composition-native.py toolchain
      - name: Exercise MVS and ordinary publisher sandwiches
        run: python3 -B tests/composition-graphs.py toolchain --state-root .composition-graphs
      - name: Retain graph observations and unresolved format constraints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-graphs-${{ matrix.runner }}
          include-hidden-files: true
          path: |
            .composition-graphs/report.json
            .composition-graphs/commands.log

  gopath-native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Current SDK native GOPATH workflow
        run: |
          tools="$(nix build --no-link --print-out-paths .#toolchain)"
          version="$(nix eval --raw .#toolchain.go.version)"
          python3 tests/gopath-native.py "$tools" "go$version"
      - name: Original stable Go native GOPATH workflow
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          tools="$(nix build --no-link --print-out-paths .#checks.x86_64-linux.gopath-go10-tools)"
          python3 tests/gopath-native.py "$tools" go1.0.3
      - name: SDK recipes evaluate without IFD and survive cold-store copying
        run: |
          nix eval --impure --option allow-import-from-derivation false --json --expr 'import ./tests/sdk-context.nix {}'
          python3 tests/sdk-portable.py

  conformance-relock:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the toolchain
        run: nix build .#toolchain --out-link toolchain
      - name: Lock this repository and the fixtures again
        run: |
          for dir in . tests/fixtures/hello tests/fixtures/workspace tests/fixtures/replace/app tests/fixtures/vcs; do
            (cd "$dir" && "$GITHUB_WORKSPACE/toolchain/bin/go-purifier" lock)
          done
      - name: Lock fzf again, into the lockfile kept in this repository
        run: |
          git clone --quiet --depth 1 --branch v0.74.5 https://github.com/junegunn/fzf "$RUNNER_TEMP/fzf"
          test "$(git -C "$RUNNER_TEMP/fzf" rev-parse HEAD)" = c0a193e031f01fb50bf6f7be4381990a3753f7cf
          (cd "$RUNNER_TEMP/fzf" && "$GITHUB_WORKSPACE/toolchain/bin/go-purifier" lock --lockfile "$GITHUB_WORKSPACE/tests/real-world/fzf/go-purifier.lock.json")
      - name: Write the conformance fixtures again
        run: tests/conformance-fixtures.sh
      - name: Compare with the committed files
        run: git diff --exit-code && test -z "$(git status --porcelain -- tests)"

  conformance-rebuild:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the hello fixture twice
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build ".#checks.$system.fixture-hello-build" --no-link
          nix build ".#checks.$system.fixture-hello-build" --no-link --rebuild

  conformance-offline:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the toolchain
        run: nix build .#toolchain --out-link toolchain
      - name: Prefetch, then work with no network
        run: tests/interactive.sh toolchain/bin

  conformance-update:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the toolchain
        run: nix build .#toolchain --out-link toolchain
      - name: Update a fixture that pins an old version
        run: tests/update.sh toolchain/bin

  outside-the-sandbox:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the toolchain
        run: nix build .#toolchain --out-link toolchain
      - name: Errors of common lockfile mistakes
        run: tests/negative.sh toolchain/bin
      - name: Publish up to the tag
        run: tests/release.sh toolchain/bin
      - name: Modules from Mercurial, Subversion, Bazaar and Fossil
        run: tests/vcs-systems.sh toolchain/bin

  ffi-lifecycle-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GO_FFI_SOURCE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Prepare isolated lifecycle targets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ffi-lifecycle"
          export GO_FFI_EXPRESSION="$RUNNER_TEMP/ffi-lifecycle/target.nix"
          echo "GO_FFI_EXPRESSION=$GO_FFI_EXPRESSION" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/ffi-lifecycle/source-revision"
          cat > "$GO_FFI_EXPRESSION" <<'NIX'
          let
            f = builtins.getFlake ("path:" + builtins.getEnv "GO_FFI_SOURCE");
            p = import f.inputs.nixpkgs {
              system = builtins.currentSystem;
              overlays = [ f.overlays.default ];
            };
          in import (/. + builtins.getEnv "GO_FFI_SOURCE" + "/tests/ffi-lifecycle-controls.nix") {
            pkgs = p;
            build = p.go-purifier.buildGoProject;
          }
          NIX
          nix eval --impure --raw --expr '(import (/. + builtins.getEnv "GO_FFI_EXPRESSION")).drvPath' \
            > "$RUNNER_TEMP/ffi-lifecycle/main.drv"
          nix eval --impure --raw --expr '(import (/. + builtins.getEnv "GO_FFI_EXPRESSION")).controllerCheck.drvPath' \
            > "$RUNNER_TEMP/ffi-lifecycle/controller.drv"
      - name: Run six supported lifetime controls and controller failure checks
        shell: bash
        run: |
          set +e
          nix build --impure --no-link --print-build-logs --file "$GO_FFI_EXPRESSION" \
            2>&1 | tee "$RUNNER_TEMP/ffi-lifecycle/main-build.log"
          main_pipeline=("${PIPESTATUS[@]}")
          nix build --impure --no-link --print-build-logs \
            --expr '(import (/. + builtins.getEnv "GO_FFI_EXPRESSION")).controllerCheck' \
            2>&1 | tee "$RUNNER_TEMP/ffi-lifecycle/controller-build.log"
          controller_pipeline=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${main_pipeline[0]}" > "$RUNNER_TEMP/ffi-lifecycle/main.status"
          printf '%s\n' "${controller_pipeline[0]}" > "$RUNNER_TEMP/ffi-lifecycle/controller.status"
          if (( main_pipeline[0] != 0 )); then exit "${main_pipeline[0]}"; fi
          if (( controller_pipeline[0] != 0 )); then exit "${controller_pipeline[0]}"; fi
          if (( main_pipeline[1] != 0 || controller_pipeline[1] != 0 )); then exit 1; fi
      - name: Retain native Nix logs even when a case fails
        if: always()
        shell: bash
        run: |
          for target in main controller; do
            record="$RUNNER_TEMP/ffi-lifecycle/$target.drv"
            if [ -s "$record" ]; then
              nix log "$(cat "$record")" > "$RUNNER_TEMP/ffi-lifecycle/$target-nix.log" 2>&1 || true
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ffi-lifecycle-${{ matrix.runner }}
          path: ${{ runner.temp }}/ffi-lifecycle
          if-no-files-found: error
